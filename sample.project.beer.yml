apps:
  - name: db-1
    ports:
      - 5432
    host: localhost
    type: container
    volumes:
      - /var/lib/mysql
    dirs:
      - /var/lib/mysql
      
  - name: web-1
    ports:
      - 4000
    host: localhost
    type: container
    volumes:
      - /var/lib/mysql
    dirs: 
      - /var/lib/mysql

triggers:
  # alias to a shell command or script
  - name: beer_action
    type: action
    # command: "echo 'Action beer trigger executed'"
    # or script: script_name
    # like "script: beer_script.sh"
    script: |
      echo "Action beer trigger executed from script"

  # scheduled trigger of an action or command
  - name: beer
    type: cron
    schedule: "0 0 * * *"
    # or action: action_name
    command: "echo 'Beer trigger executed'"

  # render a button in the UI to trigger an action or command
  - name: beer
    type: manual
    # or action: action_name
    command: "echo 'Manual beer trigger executed'"

  # creates a mocked webhook endpoint that triggers an action or command
  - name: beer
    type: webhook
    # or command: command_name
    action: beer_action
    variables:
      - name: timestamp
        type: string
        default: "2023-10-01T00:00:00Z"
    request:
      url: http://localhost:8080/beer
      method: POST
      headers:
        Content-Type: application/json
      body:
        message: "Triggered by webhook"
        timestamp: ${timestamp}
    
  - name: beer http
    type: http_collection
    variables:
      - name: beer_id
        type: integer
        value: 1
      
      - name: beer_name
        type: string
        value: "Default Beer"
      
      - name: base_url
        type: string
        value: "http://localhost:8080/beer"
    requests: 
      - name: get_beer
        description: Get beer details
        url: ${base_url}
        method: GET
        headers:
          Content-Type: application/json
        query:
          id: ${beer_id}

      - name: post_beer
        description: Post new beer
        url: ${base_url}
        method: POST
        headers:
          Content-Type: application/json
        body:
          name: ${beer_name}
          type: "IPA"
          alcohol_content: 5.5
